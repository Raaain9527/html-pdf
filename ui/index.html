<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML → PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-subtle: #eff6ff;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #22c55e;
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  line-height: 1.5; -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden;
}

/* Split layout */
.app-split { display: flex; height: 100vh; }
.panel-left { width: 440px; min-width: 320px; overflow-y: auto; padding: 24px 20px 80px; display: flex; flex-direction: column; gap: 16px; background: var(--bg); }
.divider { width: 4px; cursor: col-resize; background: var(--border); flex-shrink: 0; transition: background 150ms; }
.divider:hover, .divider.dragging { background: var(--accent); }
.panel-right { flex: 1; min-width: 400px; display: flex; flex-direction: column; background: #e2e8f0; }

/* Header */
.header { display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; background: var(--accent); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
.subtitle { font-size: 11px; color: var(--text-secondary); }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.card-header { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 14px; background: #f1f5f9; border-radius: var(--radius); padding: 3px; }
.tab { flex: 1; text-align: center; padding: 7px 12px; font-size: 12px; font-weight: 500; border-radius: 5px; cursor: pointer; color: var(--text-secondary); transition: all 150ms ease; border: none; background: none; font-family: var(--font); }
.tab.active { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }

/* Drop Zone */
.drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: all 200ms ease; }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-subtle); }
.drop-icon { width: 36px; height: 36px; margin: 0 auto 8px; background: var(--accent-subtle); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.drop-label { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.drop-hint { font-size: 11px; color: var(--text-muted); }
.file-selected { display: none; align-items: center; gap: 8px; padding: 8px 12px; background: var(--accent-subtle); border-radius: var(--radius-sm); font-size: 12px; font-family: var(--mono); word-break: break-all; margin-top: 10px; }

/* URL Input */
.url-row { display: flex; gap: 6px; margin-top: 10px; }
.url-input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--mono); color: var(--text); background: #f8fafc; outline: none; }
.url-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.url-input::placeholder { font-family: var(--font); color: var(--text-muted); font-size: 12px; }

/* Button */
.btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 150ms ease; font-family: var(--font); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: #f8fafc; }
.btn-sm { padding: 5px 10px; font-size: 11px; }

/* Settings */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.setting { display: flex; flex-direction: column; gap: 2px; }
.setting label { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; }
.setting input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--mono); color: var(--text); background: #f8fafc; outline: none; }
.setting input:focus { border-color: var(--accent); }
.setting-unit { font-size: 10px; color: var(--text-muted); }

/* Action Bar */
.action-bar { display: flex; gap: 8px; align-items: center; }
.export-hint { font-size: 11px; color: var(--text-muted); flex: 1; }

/* Status */
.status { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; display: none; }
.status.show { display: block; }
.status.loading { background: #eff6ff; color: #1e40af; }
.status.success { background: #f0fdf4; color: #166534; }
.status.error { background: #fef2f2; color: #991b1b; }

/* Right panel — preview (流式投影, ADR 0001/0002) */
.preview-toolbar { height: 36px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 12px; font-size: 11px; color: var(--text-secondary); }
.daemon-status { font-size: 11px; }
.daemon-status.loading { color: var(--warning); }
.daemon-status.ok { color: var(--success); }
.daemon-status.error { color: var(--danger); }
.zoom-controls { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.preview-scale-label { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
.preview-frame-wrap { flex: 1; overflow: auto; display: flex; justify-content: flex-start; align-items: flex-start; padding: 12px; background: #e2e8f0; }
/* canvas 显示后台投射帧; flex-shrink:0 保持视口不被面板压缩, 显示大小由 fit/缩放控制 */
.preview-canvas { flex-shrink: 0; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.15); cursor: crosshair; outline: none; }

/* Footer */
.footer { font-size: 10px; color: var(--text-muted); text-align: center; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 600ms linear infinite; }

@media (max-width: 960px) {
  .panel-left { width: 100%; min-width: 0; border-right: none; }
  .panel-right { display: none; }
}
</style>
</head>
<body>
<div class="app-split">

  <!-- Left Panel -->
  <div class="panel-left">
    <div class="header">
      <div class="logo">&lt;/&gt;</div>
      <div>
        <div class="title">HTML → PDF</div>
        <div class="subtitle">长页面单页导出 · 矢量文字</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">输入</div>
      <div class="tabs">
        <button class="tab active" data-tab="file">📄 文件</button>
        <button class="tab" data-tab="url">🔗 URL</button>
      </div>
      <div id="tab-file">
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">↑</div>
          <div class="drop-label">选择 HTML 文件</div>
          <div class="drop-hint">点击或拖拽 .html / .htm</div>
        </div>
        <div class="file-selected" id="fileSelected"></div>
      </div>
      <div id="tab-url" style="display:none">
        <div class="url-row">
          <input class="url-input" id="urlInput" placeholder="https://example.com" autocomplete="off">
          <button class="btn btn-secondary btn-sm" id="urlFetch">加载</button>
        </div>
        <div id="urlStatus" style="font-size:11px;color:var(--text-muted);margin-top:4px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">导出设置</div>
      <div class="settings-grid">
        <div class="setting"><label>视口宽度 <span id="viewportHint" style="font-weight:400;color:var(--accent);"></span></label><input type="number" id="viewportWidth" value="1680" min="320" max="5120" step="10"><span class="setting-unit">px</span></div>
        <div class="setting"><label>页面宽度</label><input type="text" id="pdfWidth" placeholder="自动"><span class="setting-unit">留空=自动</span></div>
        <div class="setting"><label>页面高度</label><input type="text" id="pdfHeight" placeholder="单页自适应"><span class="setting-unit">留空=单页</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" id="advancedToggle" style="cursor:pointer;user-select:none;">高级选项 <span style="font-weight:400;margin-left:4px;">▸</span></div>
      <div id="advancedBody" style="display:none;">
        <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">输出</div>
        <div class="settings-grid">
          <div class="setting"><label>输出缩放</label><input type="number" id="scale" value="1" min="0.25" max="4" step="0.05"><span class="setting-unit">PDF 整体缩放倍数</span></div>
        </div>

        <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">水印</div>
        <div class="settings-grid">
          <div class="setting"><label>水印文字</label><input type="text" id="watermarkText" placeholder="留空=无水印"></div>
          <div class="setting"><label>透明度</label><input type="number" id="watermarkOpacity" value="0.08" min="0.01" max="1" step="0.01"></div>
          <div class="setting"><label>字号</label><input type="number" id="watermarkSize" value="60" min="10" max="200"></div>
          <div class="setting"><label>旋转</label><input type="number" id="watermarkRotation" value="-30" min="-90" max="90"></div>
        </div>
        <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">密码</div>
        <div class="settings-grid">
          <div class="setting"><label>打开密码</label><input type="text" id="password" placeholder="留空=无密码"></div>
          <div class="setting"><label>所有者密码</label><input type="text" id="ownerPassword" placeholder="默认同打开密码"></div>
        </div>
        <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">元数据</div>
        <div class="settings-grid">
          <div class="setting"><label>标题</label><input type="text" id="metaTitle" placeholder="PDF 标题"></div>
          <div class="setting"><label>作者</label><input type="text" id="metaAuthor" placeholder="作者名"></div>
          <div class="setting"><label>主题</label><input type="text" id="metaSubject" placeholder="主题"></div>
          <div class="setting"><label>关键词</label><input type="text" id="metaKeywords" placeholder="逗号分隔"></div>
        </div>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="action-bar">
      <button class="btn btn-primary" id="exportBtn" disabled>
        <span id="exportSpinner" style="display:none" class="spinner"></span>导出 PDF
      </button>
      <span class="export-hint" id="exportHint">选择文件或输入 URL</span>
    </div>

    <div class="footer">Powered by Chromium · 矢量 PDF</div>
  </div>

  <div class="divider" id="divider"></div>

  <!-- Right Panel - Preview (流式投影: canvas 显示 daemon 投射帧) -->
  <div class="panel-right">
    <div class="preview-toolbar">
      <span class="daemon-status" id="daemonStatus">预览服务：未启动</span>
      <button class="btn btn-sm btn-secondary" id="stopDaemon" disabled>关闭 Node</button>
      <div class="zoom-controls">
        <button class="btn btn-sm" id="zoomFit" title="适配面板宽度">适配</button>
        <button class="btn btn-sm" id="zoom100" title="1:1 显示">1:1</button>
        <span class="preview-scale-label" id="previewScale">1680×900px</span>
      </div>
    </div>
    <div class="preview-frame-wrap" id="previewWrap">
      <canvas id="previewCanvas" class="preview-canvas" tabindex="0"></canvas>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// --- State ---
let selectedFile = null;
let previewDebounce = null;

// --- Divider drag ---
const divider = $('#divider');
const leftPanel = $('.panel-left');
let dragging = false;
divider.addEventListener('mousedown', e => { dragging = true; divider.classList.add('dragging'); e.preventDefault(); });
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const w = Math.max(320, Math.min(600, e.clientX));
  leftPanel.style.width = w + 'px';
  updateCanvasScale();
});
document.addEventListener('mouseup', () => { dragging = false; divider.classList.remove('dragging'); });

// --- Preview (流式投影, ADR 0001/0002) ---
let daemonUrl = null;
let previewWs = null;
let canvas = $('#previewCanvas');
let ctx = canvas.getContext('2d');
let currentViewport = { width: 1680, height: 900 };
let zoomMode = 'fit';      // fit | 100 | zoom
let zoomLevel = 1;
let lastMoveAt = 0;
let captureResolve = null;
let frameImg = new Image();
let lastSharpAt = 0; // 高清帧到达时间; 期间忽略 live 帧避免被软帧覆盖
let viewportTouched = false; // 用户手动改过视口宽 → 不再自动适配
let autoFitFile = null;      // 已自动适配过的文件, 防循环
let fitPending = null;       // 断点感知自动适配的探测状态 {probe, target}

function setDaemonStatus(text, cls) {
  const el = $('#daemonStatus');
  el.textContent = text;
  el.className = 'daemon-status ' + (cls || '');
}

function sendToDaemon(obj) {
  if (previewWs && previewWs.readyState === WebSocket.OPEN) previewWs.send(JSON.stringify(obj));
}

function drawFrame(b64) {
  // 拉伸填满缓冲: live 帧(视口 CSS 分辨率)与 sharp 帧(视口×SCALE)混合, 统一铺满画布
  frameImg.onload = () => ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
  frameImg.src = 'data:image/jpeg;base64,' + b64;
}

async function ensureDaemon() {
  if (previewWs && previewWs.readyState === WebSocket.OPEN) return true;
  setDaemonStatus('启动预览服务...', 'loading');
  try {
    daemonUrl = await window.__TAURI__.core.invoke('start_preview_daemon');
  } catch (e) {
    setDaemonStatus('启动失败: ' + e, 'error');
    return false;
  }
  return new Promise((resolve) => {
    previewWs = new WebSocket(daemonUrl);
    previewWs.onopen = () => { setDaemonStatus('运行中', 'ok'); $('#stopDaemon').disabled = false; resolve(true); };
    previewWs.onerror = () => { setDaemonStatus('连接失败', 'error'); resolve(false); };
    previewWs.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'frame') {
        // 高清优先: sharp 帧记时; 近期已显示高清帧则忽略迟到的 live 帧(避免被软帧覆盖), 新交互后恢复
        if (m.sharp) { lastSharpAt = Date.now(); drawFrame(m.data); }
        else if (!lastSharpAt || Date.now() - lastSharpAt > 400) drawFrame(m.data);
      }
      else if (m.type === 'status') {
        if (m.state === 'error') setDaemonStatus('渲染错误: ' + (m.message || ''), 'error');
        else if (m.state === 'ready') {
          // 绘制缓冲 = daemon 栅格分辨率 (视口×SCALE, 如 3360×1800), 提升清晰度
          if (m.resolution) { canvas.width = m.resolution.width; canvas.height = m.resolution.height; }
          if (m.contentWidth) $('#viewportHint').textContent = `(内容宽 ${m.contentWidth}px)`;
          handleAutoFit(m);
        }
      }
      else if (m.type === 'capture-result') { if (captureResolve) { captureResolve(m.html); captureResolve = null; } }
    };
  });
}

async function loadPreview(input) {
  if (!input) return;
  if (!await ensureDaemon()) return;
  const vw = parseInt($('#viewportWidth').value) || 1680;
  const vh = 900; // 与导出视口高一致 (html2pdf-lib.js:77)
  currentViewport = { width: vw, height: vh };
  $('#previewScale').textContent = vw + '×' + vh + 'px';
  sendToDaemon({ type: 'open', url: /^https?:\/\//i.test(input) ? input : undefined, path: /^https?:\/\//i.test(input) ? undefined : input, viewportWidth: vw, viewportHeight: vh });
  updateCanvasScale();
}

function updateCanvasScale() {
  const { width: vw, height: vh } = currentViewport;
  let dispW, dispH;
  if (zoomMode === 'fit') {
    const wrapW = $('#previewWrap').clientWidth - 24; // padding 12*2
    const s = Math.max(0.05, Math.min(1, wrapW / vw));
    dispW = Math.round(vw * s); dispH = Math.round(vh * s);
  } else if (zoomMode === '100') {
    dispW = vw; dispH = vh;
  } else { // zoom
    dispW = Math.round(vw * zoomLevel); dispH = Math.round(vh * zoomLevel);
  }
  canvas.style.width = dispW + 'px';
  canvas.style.height = dispH + 'px';
}

function refreshPreview() {
  clearTimeout(previewDebounce);
  previewDebounce = setTimeout(() => { if (selectedFile) loadPreview(selectedFile); }, 300);
}

// --- 断点感知自动适配 (ADR 0002 fit) ---
// 页面远窄于视口 → 视口调到内容宽+边距让页面铺满; 若适配后页面变成全宽(命中页面自身
// 响应式断点, 如 @media max-width:920px 使两列塌成一列), 抬升视口直到布局稳定。
function handleAutoFit(m) {
  if (viewportTouched) return;
  if (!fitPending) {
    if (autoFitFile === selectedFile) return;
    const c = m.contentWidth;
    if (c && c < currentViewport.width * 0.7) {
      fitPending = { probe: 0, target: Math.min(Math.max(c + 40, 320), 5120) };
      applyFit(fitPending.target);
    }
    return;
  }
  // 探测中
  if (m.contentWidth === 0) {
    fitPending.probe++;
    if (fitPending.probe > 8) { finishFit(); return; }
    fitPending.target += 80;
    applyFit(fitPending.target);
  } else {
    finishFit();
  }
}
function applyFit(v) { $('#viewportWidth').value = v; loadPreview(selectedFile); }
function finishFit() { autoFitFile = selectedFile; fitPending = null; }

// --- 输入转发 (交互始终可用, 取代原"交互模式"开关) ---
function canvasToViewport(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - rect.left) * (currentViewport.width / rect.width)),
    y: Math.round((e.clientY - rect.top) * (currentViewport.height / rect.height)),
  };
}
let mousePressed = false;
let downViewportPoint = null; // 按下时的视口坐标, 用于点击容差
canvas.addEventListener('mousemove', (e) => {
  const now = Date.now();
  if (now - lastMoveAt < 33) return; // ~30fps 节流
  const p = canvasToViewport(e);
  // 按住期间抑制 <6px 的微小移动, 防止手抖把单击变拖选一大片文字; >6px 才转发(真拖动)
  if (mousePressed && downViewportPoint && Math.hypot(p.x - downViewportPoint.x, p.y - downViewportPoint.y) < 6) return;
  lastMoveAt = now;
  lastSharpAt = 0; // 新交互 → 接受 live 帧
  sendToDaemon({ type: 'input', kind: 'mousemove', x: p.x, y: p.y });
});
canvas.addEventListener('mousedown', (e) => {
  const p = canvasToViewport(e);
  mousePressed = true;
  downViewportPoint = p;
  lastSharpAt = 0;
  const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
  sendToDaemon({ type: 'input', kind: 'mousedown', x: p.x, y: p.y, button });
  canvas.focus();
});
canvas.addEventListener('mouseup', (e) => {
  const p = canvasToViewport(e);
  mousePressed = false;
  downViewportPoint = null;
  lastSharpAt = 0;
  const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
  sendToDaemon({ type: 'input', kind: 'mouseup', x: p.x, y: p.y, button });
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  lastSharpAt = 0;
  if (e.ctrlKey) { // Ctrl+滚轮 = 图像缩放 (ADR 0002)
    zoomMode = 'zoom';
    zoomLevel = Math.max(0.2, Math.min(4, zoomLevel * (e.deltaY < 0 ? 1.1 : 0.9)));
    updateCanvasScale();
  } else { // 普通滚轮 = 页面滚动, 转发给 daemon
    sendToDaemon({ type: 'input', kind: 'wheel', deltaX: e.deltaX, deltaY: e.deltaY });
  }
}, { passive: false });
canvas.addEventListener('keydown', (e) => {
  if (e.key.length === 1) { e.preventDefault(); sendToDaemon({ type: 'input', kind: 'type', key: e.key }); }
});

// --- 缩放控制 (fit 默认 + 图像缩放) ---
$('#zoomFit').addEventListener('click', () => { zoomMode = 'fit'; updateCanvasScale(); });
$('#zoom100').addEventListener('click', () => { zoomMode = '100'; updateCanvasScale(); });

// --- daemon 生命周期 (懒加载 + 用户可关闭, ADR 0002) ---
$('#stopDaemon').addEventListener('click', async () => {
  if (previewWs) { previewWs.close(); previewWs = null; }
  try { await window.__TAURI__.core.invoke('stop_preview_daemon'); } catch (e) {}
  daemonUrl = null;
  $('#stopDaemon').disabled = true;
  setDaemonStatus('已关闭');
});

$('#viewportWidth').addEventListener('input', () => { viewportTouched = true; refreshPreview(); });
window.addEventListener('resize', updateCanvasScale);

// --- Advanced toggle ---
$('#advancedToggle').addEventListener('click', () => {
  const body = $('#advancedBody'), arrow = $('#advancedToggle span');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  arrow.textContent = open ? '▸' : '▾';
});

// --- Tabs ---
$$('.tab').forEach(tab => tab.addEventListener('click', () => {
  $$('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  $('#tab-file').style.display = tab.dataset.tab === 'file' ? '' : 'none';
  $('#tab-url').style.display = tab.dataset.tab === 'url' ? '' : 'none';
  updateExportState();
}));

// --- File selection ---
const dropZone = $('#dropZone');
function resetFitState() { fitPending = null; autoFitFile = null; }
dropZone.addEventListener('click', async () => {
  try { selectedFile = await window.__TAURI__.core.invoke('pick_file'); updateExportState(); resetFitState(); loadPreview(selectedFile); } catch(e){}
});
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); });

if (window.__TAURI__?.event) {
  window.__TAURI__.event.listen('file-dropped', e => {
    selectedFile = e.payload; updateExportState(); resetFitState(); loadPreview(selectedFile);
  });
}

// --- URL handling ---
$('#urlFetch').addEventListener('click', () => {
  const url = $('#urlInput').value.trim();
  if (!url) return;
  try { new URL(url); } catch { showStatus('无效 URL', 'error'); return; }
  selectedFile = url;
  $('#urlStatus').textContent = '✓ ' + url;
  updateExportState();
  resetFitState();
  loadPreview(url);
});
$('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#urlFetch').click(); });

// --- Settings ---
function collectOptions() {
  const opts = {
    viewportWidth: parseInt($('#viewportWidth').value) || 1280,
    scale: parseFloat($('#scale').value) || 1,
    width: $('#pdfWidth').value || null,
    height: $('#pdfHeight').value || null,
    marginTop: '0px', marginRight: '0px', marginBottom: '0px', marginLeft: '0px',
  };
  const wt = $('#watermarkText').value.trim();
  if (wt) { opts.watermark = { text: wt, opacity: parseFloat($('#watermarkOpacity').value)||0.08, rotation: parseFloat($('#watermarkRotation').value)||-30, fontSize: parseInt($('#watermarkSize').value)||60 }; }
  const pw = $('#password').value.trim();
  if (pw) opts.password = { userPassword: pw, ownerPassword: $('#ownerPassword').value.trim() || pw };
  const meta = {};
  if ($('#metaTitle').value.trim()) meta.title = $('#metaTitle').value.trim();
  if ($('#metaAuthor').value.trim()) meta.author = $('#metaAuthor').value.trim();
  if ($('#metaSubject').value.trim()) meta.subject = $('#metaSubject').value.trim();
  if ($('#metaKeywords').value.trim()) meta.keywords = $('#metaKeywords').value.trim();
  if (Object.keys(meta).length) opts.metadata = meta;
  return opts;
}

function updateExportState() {
  if (selectedFile) {
    const label = /^https?:\/\//i.test(selectedFile) ? selectedFile : selectedFile.split(/[\\/]/).pop();
    $('#fileSelected').style.display = 'flex';
    $('#fileSelected').innerHTML = `<span style="color:var(--accent);font-weight:600;">📄</span> <span style="font-family:var(--mono);word-break:break-all;">${label}</span>`;
    $('#exportHint').textContent = '就绪 — 点击导出';
  } else {
    $('#fileSelected').style.display = 'none';
    $('#exportHint').textContent = '选择文件或输入 URL';
  }
  $('#exportBtn').disabled = !selectedFile;
}

function captureFromDaemon() {
  return new Promise((resolve, reject) => {
    if (!previewWs || previewWs.readyState !== WebSocket.OPEN) return reject(new Error('预览服务未连接'));
    const t = setTimeout(() => reject(new Error('capture 超时')), 8000);
    captureResolve = (html) => { clearTimeout(t); resolve(html); };
    sendToDaemon({ type: 'capture' });
  });
}

// --- Export ---
$('#exportBtn').addEventListener('click', async () => {
  if ($('#tab-url').style.display !== 'none') {
    const url = $('#urlInput').value.trim();
    if (url) selectedFile = url;
  }
  if (!selectedFile) return;

  const btn = $('#exportBtn'), spinner = $('#exportSpinner');
  btn.disabled = true; spinner.style.display = ''; showStatus('正在渲染...', 'loading');

  try {
    let exportInput = selectedFile;
    // 文件输入: 从 daemon 捕获当前 DOM(含交互状态)保证所见即所得; 预览不可用时回退原文件
    if (!/^https?:\/\//i.test(selectedFile)) {
      try {
        if (previewWs && previewWs.readyState === WebSocket.OPEN) {
          const captured = await captureFromDaemon();
          if (captured) exportInput = await window.__TAURI__.core.invoke('write_temp_html', { originalPath: selectedFile, html: captured });
        }
      } catch(e) { /* 预览不可用 → 直接用原文件导出 */ }
    }

    const opts = collectOptions();
    const result = await window.__TAURI__.core.invoke('export_pdf', { input: exportInput, options: JSON.stringify(opts) });
    showStatus('导出完成 ✓ ' + result, 'success');
  } catch(e) {
    showStatus('导出失败: ' + (typeof e === 'string' ? e : JSON.stringify(e)), 'error');
  } finally {
    btn.disabled = false; spinner.style.display = 'none';
  }
});

function showStatus(msg, type) {
  const el = $('#status'); el.textContent = msg; el.className = 'status show ' + type;
  if (type === 'success') setTimeout(() => el.classList.remove('show'), 6000);
}

// Startup: check node
(async () => {
  try { if (!await window.__TAURI__.core.invoke('check_node')) showStatus('⚠ 未检测到 Node.js，PDF 导出将无法使用', 'error'); } catch(e){}
  updateExportState();
})();
</script>
</body>
</html>
