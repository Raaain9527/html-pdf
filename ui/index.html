<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML → PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-subtle: #eff6ff;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #22c55e;
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  line-height: 1.5; -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden;
}

/* Split layout */
.app-split { display: flex; height: 100vh; }
.panel-left { width: 440px; min-width: 380px; overflow-y: auto; padding: 24px 20px 80px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid var(--border); background: var(--bg); }
.panel-right { flex: 1; min-width: 400px; display: flex; flex-direction: column; background: #e2e8f0; }

/* Header */
.header { display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; background: var(--accent); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
.subtitle { font-size: 11px; color: var(--text-secondary); }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.card-header { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 14px; background: #f1f5f9; border-radius: var(--radius); padding: 3px; }
.tab { flex: 1; text-align: center; padding: 7px 12px; font-size: 12px; font-weight: 500; border-radius: 5px; cursor: pointer; color: var(--text-secondary); transition: all 150ms ease; border: none; background: none; font-family: var(--font); }
.tab.active { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }

/* Drop Zone */
.drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: all 200ms ease; }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-subtle); }
.drop-icon { width: 36px; height: 36px; margin: 0 auto 8px; background: var(--accent-subtle); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.drop-label { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.drop-hint { font-size: 11px; color: var(--text-muted); }
.file-selected { display: none; align-items: center; gap: 8px; padding: 8px 12px; background: var(--accent-subtle); border-radius: var(--radius-sm); font-size: 12px; font-family: var(--mono); word-break: break-all; margin-top: 10px; }

/* URL Input */
.url-row { display: flex; gap: 6px; margin-top: 10px; }
.url-input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--mono); color: var(--text); background: #f8fafc; outline: none; }
.url-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.url-input::placeholder { font-family: var(--font); color: var(--text-muted); font-size: 12px; }

/* Button */
.btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 150ms ease; font-family: var(--font); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: #f8fafc; }
.btn-sm { padding: 5px 10px; font-size: 11px; }

/* Settings */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.setting { display: flex; flex-direction: column; gap: 2px; }
.setting label { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; }
.setting input { padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--mono); color: var(--text); background: #f8fafc; outline: none; }
.setting input:focus { border-color: var(--accent); }
.setting-unit { font-size: 10px; color: var(--text-muted); }

/* Action Bar */
.action-bar { display: flex; gap: 8px; align-items: center; }
.export-hint { font-size: 11px; color: var(--text-muted); flex: 1; }

/* Status */
.status { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; display: none; }
.status.show { display: block; }
.status.loading { background: #eff6ff; color: #1e40af; }
.status.success { background: #f0fdf4; color: #166534; }
.status.error { background: #fef2f2; color: #991b1b; }

/* Right panel — preview */
.preview-toolbar { height: 36px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 12px; font-size: 11px; color: var(--text-secondary); }
.interaction-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
.interaction-toggle input { cursor: pointer; }
.preview-scale-label { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-left: auto; }
.preview-frame-wrap { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
.preview-frame { border: none; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.15); transform-origin: top center; }
.interaction-active { outline: 2px solid var(--warning); outline-offset: 2px; }

/* Footer */
.footer { font-size: 10px; color: var(--text-muted); text-align: center; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 600ms linear infinite; }

@media (max-width: 960px) {
  .panel-left { width: 100%; min-width: 0; border-right: none; }
  .panel-right { display: none; }
}
</style>
</head>
<body>
<div class="app-split">

  <!-- Left Panel -->
  <div class="panel-left">
    <div class="header">
      <div class="logo">&lt;/&gt;</div>
      <div>
        <div class="title">HTML → PDF</div>
        <div class="subtitle">长页面单页导出 · 矢量文字</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">输入</div>
      <div class="tabs">
        <button class="tab active" data-tab="file">📄 文件</button>
        <button class="tab" data-tab="url">🔗 URL</button>
      </div>
      <div id="tab-file">
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">↑</div>
          <div class="drop-label">选择 HTML 文件</div>
          <div class="drop-hint">点击或拖拽 .html / .htm</div>
        </div>
        <div class="file-selected" id="fileSelected"></div>
      </div>
      <div id="tab-url" style="display:none">
        <div class="url-row">
          <input class="url-input" id="urlInput" placeholder="https://example.com" autocomplete="off">
          <button class="btn btn-secondary btn-sm" id="urlFetch">加载</button>
        </div>
        <div id="urlStatus" style="font-size:11px;color:var(--text-muted);margin-top:4px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">导出设置</div>
      <div class="settings-grid">
        <div class="setting"><label>视口宽度</label><input type="number" id="viewportWidth" value="1280" min="320" max="5120" step="10"><span class="setting-unit">px</span></div>
        <div class="setting"><label>缩放比例</label><input type="number" id="scale" value="1" min="0.25" max="4" step="0.05"><span class="setting-unit">0.5-4x</span></div>
        <div class="setting"><label>页面宽度</label><input type="text" id="pdfWidth" placeholder="自动"><span class="setting-unit">留空=自动</span></div>
        <div class="setting"><label>页面高度</label><input type="text" id="pdfHeight" placeholder="单页自适应"><span class="setting-unit">留空=单页</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" id="advancedToggle" style="cursor:pointer;user-select:none;">高级选项 <span style="font-weight:400;margin-left:4px;">▸</span></div>
      <div id="advancedBody" style="display:none;">
        <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">水印</div>
        <div class="settings-grid">
          <div class="setting"><label>水印文字</label><input type="text" id="watermarkText" placeholder="留空=无水印"></div>
          <div class="setting"><label>透明度</label><input type="number" id="watermarkOpacity" value="0.08" min="0.01" max="1" step="0.01"></div>
          <div class="setting"><label>字号</label><input type="number" id="watermarkSize" value="60" min="10" max="200"></div>
          <div class="setting"><label>旋转</label><input type="number" id="watermarkRotation" value="-30" min="-90" max="90"></div>
        </div>
        <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">密码</div>
        <div class="settings-grid">
          <div class="setting"><label>打开密码</label><input type="text" id="password" placeholder="留空=无密码"></div>
          <div class="setting"><label>所有者密码</label><input type="text" id="ownerPassword" placeholder="默认同打开密码"></div>
        </div>
        <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.3px;">元数据</div>
        <div class="settings-grid">
          <div class="setting"><label>标题</label><input type="text" id="metaTitle" placeholder="PDF 标题"></div>
          <div class="setting"><label>作者</label><input type="text" id="metaAuthor" placeholder="作者名"></div>
          <div class="setting"><label>主题</label><input type="text" id="metaSubject" placeholder="主题"></div>
          <div class="setting"><label>关键词</label><input type="text" id="metaKeywords" placeholder="逗号分隔"></div>
        </div>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="action-bar">
      <button class="btn btn-primary" id="exportBtn" disabled>
        <span id="exportSpinner" style="display:none" class="spinner"></span>导出 PDF
      </button>
      <span class="export-hint" id="exportHint">选择文件或输入 URL</span>
    </div>

    <div class="footer">Powered by Chromium · 矢量 PDF</div>
  </div>

  <!-- Right Panel - Preview -->
  <div class="panel-right">
    <div class="preview-toolbar">
      <label class="interaction-toggle">
        <input type="checkbox" id="interactionMode"><span>交互模式</span>
      </label>
      <span style="font-size:11px;color:var(--text-muted);">开启后可点击页面元素</span>
      <span class="preview-scale-label" id="previewScale">1280px @ 100%</span>
    </div>
    <div class="preview-frame-wrap" id="previewWrap">
      <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// --- State ---
let selectedFile = null;
let previewDebounce = null;
let interactionMode = false;

// --- Preview ---
async function loadPreview(input) {
  if (!input) { $('#previewFrame').src = 'about:blank'; return; }
  const vw = parseInt($('#viewportWidth').value) || 1280;
  const sc = parseFloat($('#scale').value) || 1;

  if (/^https?:\/\//i.test(input)) {
    $('#previewFrame').src = input;
    $('#interactionMode').disabled = true;
  } else {
    $('#interactionMode').disabled = false;
    try {
      const html = await window.__TAURI__.core.invoke('read_file', { path: input });
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      let meta = doc.querySelector('meta[name="viewport"]');
      if (!meta) { meta = doc.createElement('meta'); meta.name = 'viewport'; doc.head.prepend(meta); }
      meta.content = `width=${vw}, initial-scale=${sc}`;
      const blob = new Blob(['<!DOCTYPE html>\n' + doc.documentElement.outerHTML], { type: 'text/html' });
      $('#previewFrame').src = URL.createObjectURL(blob);
    } catch(e) { /* file read failed */ }
  }
  updatePreviewScale();
}

function updatePreviewScale() {
  const vw = parseInt($('#viewportWidth').value) || 1280;
  const wrap = $('#previewWrap');
  const frame = $('#previewFrame');
  const availW = wrap.clientWidth - 24;
  const ratio = Math.min(1, availW / vw);
  frame.style.width = vw + 'px';
  frame.style.transform = `scale(${ratio})`;
  $('#previewScale').textContent = `${vw}px @ ${Math.round(ratio*100)}%`;
}

function refreshPreview() {
  clearTimeout(previewDebounce);
  previewDebounce = setTimeout(() => {
    if (selectedFile && !/^https?:\/\//i.test(selectedFile)) loadPreview(selectedFile);
    updatePreviewScale();
  }, 300);
}

['#viewportWidth','#scale'].forEach(id => $(id).addEventListener('input', refreshPreview));
window.addEventListener('resize', updatePreviewScale);

// --- Interaction mode ---
$('#interactionMode').addEventListener('change', () => {
  interactionMode = $('#interactionMode').checked;
  const frame = $('#previewFrame');
  if (interactionMode) {
    frame.style.pointerEvents = 'auto';
    frame.classList.add('interaction-active');
    if (selectedFile && !/^https?:\/\//i.test(selectedFile)) loadPreview(selectedFile);
  } else {
    frame.style.pointerEvents = 'none';
    frame.classList.remove('interaction-active');
  }
});

// --- Advanced toggle ---
$('#advancedToggle').addEventListener('click', () => {
  const body = $('#advancedBody'), arrow = $('#advancedToggle span');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  arrow.textContent = open ? '▸' : '▾';
});

// --- Tabs ---
$$('.tab').forEach(tab => tab.addEventListener('click', () => {
  $$('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  $('#tab-file').style.display = tab.dataset.tab === 'file' ? '' : 'none';
  $('#tab-url').style.display = tab.dataset.tab === 'url' ? '' : 'none';
  updateExportState();
}));

// --- File selection ---
const dropZone = $('#dropZone');
dropZone.addEventListener('click', async () => {
  try { selectedFile = await window.__TAURI__.core.invoke('pick_file'); updateExportState(); loadPreview(selectedFile); } catch(e){}
});
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); });

if (window.__TAURI__?.event) {
  window.__TAURI__.event.listen('file-dropped', e => {
    selectedFile = e.payload; updateExportState(); loadPreview(selectedFile);
  });
}

// --- URL handling ---
$('#urlFetch').addEventListener('click', () => {
  const url = $('#urlInput').value.trim();
  if (!url) return;
  try { new URL(url); } catch { showStatus('无效 URL', 'error'); return; }
  selectedFile = url;
  $('#urlStatus').textContent = '✓ ' + url;
  updateExportState();
  loadPreview(url);
});
$('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#urlFetch').click(); });

// --- Settings ---
function collectOptions() {
  const opts = {
    viewportWidth: parseInt($('#viewportWidth').value) || 1280,
    scale: parseFloat($('#scale').value) || 1,
    width: $('#pdfWidth').value || null,
    height: $('#pdfHeight').value || null,
    marginTop: '0px', marginRight: '0px', marginBottom: '0px', marginLeft: '0px',
  };
  const wt = $('#watermarkText').value.trim();
  if (wt) { opts.watermark = { text: wt, opacity: parseFloat($('#watermarkOpacity').value)||0.08, rotation: parseFloat($('#watermarkRotation').value)||-30, fontSize: parseInt($('#watermarkSize').value)||60 }; }
  const pw = $('#password').value.trim();
  if (pw) opts.password = { userPassword: pw, ownerPassword: $('#ownerPassword').value.trim() || pw };
  const meta = {};
  if ($('#metaTitle').value.trim()) meta.title = $('#metaTitle').value.trim();
  if ($('#metaAuthor').value.trim()) meta.author = $('#metaAuthor').value.trim();
  if ($('#metaSubject').value.trim()) meta.subject = $('#metaSubject').value.trim();
  if ($('#metaKeywords').value.trim()) meta.keywords = $('#metaKeywords').value.trim();
  if (Object.keys(meta).length) opts.metadata = meta;
  return opts;
}

function updateExportState() {
  if (selectedFile) {
    const label = /^https?:\/\//i.test(selectedFile) ? selectedFile : selectedFile.split(/[\\/]/).pop();
    $('#fileSelected').style.display = 'flex';
    $('#fileSelected').innerHTML = `<span style="color:var(--accent);font-weight:600;">📄</span> <span style="font-family:var(--mono);word-break:break-all;">${label}</span>`;
    $('#exportHint').textContent = '就绪 — 点击导出';
  } else {
    $('#fileSelected').style.display = 'none';
    $('#exportHint').textContent = '选择文件或输入 URL';
  }
  $('#exportBtn').disabled = !selectedFile;
}

// --- Export ---
$('#exportBtn').addEventListener('click', async () => {
  if ($('#tab-url').style.display !== 'none') {
    const url = $('#urlInput').value.trim();
    if (url) selectedFile = url;
  }
  if (!selectedFile) return;

  const btn = $('#exportBtn'), spinner = $('#exportSpinner');
  btn.disabled = true; spinner.style.display = ''; showStatus('正在渲染...', 'loading');

  try {
    let exportInput = selectedFile;
    if (interactionMode && selectedFile && !/^https?:\/\//i.test(selectedFile)) {
      try {
        const frame = $('#previewFrame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        const captured = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        exportInput = await window.__TAURI__.core.invoke('write_temp_html', { originalPath: selectedFile, html: captured });
      } catch(e) { showStatus('DOM 捕获失败: '+e, 'error'); return; }
    }

    const opts = collectOptions();
    const result = await window.__TAURI__.core.invoke('export_pdf', { input: exportInput, options: JSON.stringify(opts) });
    showStatus('导出完成 ✓ ' + result, 'success');
  } catch(e) {
    showStatus('导出失败: ' + (typeof e === 'string' ? e : JSON.stringify(e)), 'error');
  } finally {
    btn.disabled = false; spinner.style.display = 'none';
  }
});

function showStatus(msg, type) {
  const el = $('#status'); el.textContent = msg; el.className = 'status show ' + type;
  if (type === 'success') setTimeout(() => el.classList.remove('show'), 6000);
}

// Startup: check node
(async () => {
  try { if (!await window.__TAURI__.core.invoke('check_node')) showStatus('⚠ 未检测到 Node.js，PDF 导出将无法使用', 'error'); } catch(e){}
  updateExportState();
})();
</script>
</body>
</html>
